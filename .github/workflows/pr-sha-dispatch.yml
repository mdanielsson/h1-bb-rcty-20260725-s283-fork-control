name: S283 external PR SHA checkout control

on:
  workflow_dispatch:
    inputs:
      pr-number:
        type: number
        required: true
        description: Pull request number whose current head should be tested
      commit-sha:
        type: string
        required: true
        description: Exact current pull request head SHA

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      actual-sha: ${{ steps.validate.outputs.actual_sha }}
    steps:
      - name: Validate current PR head SHA
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          REPO: ${{ github.repository }}
        run: |
          ACTUAL_SHA=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json headRefOid \
            --jq '.headRefOid')
          if [ "$ACTUAL_SHA" != "$COMMIT_SHA" ]; then
            echo "::error::PR head SHA mismatch"
            exit 1
          fi
          echo "actual_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

  checkout-pr-sha:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: H1_BB_RCTY_20260725_S283_CONTROL
    permissions:
      contents: read
      id-token: write
    env:
      SNOWFLAKE_ACCOUNT: ksplyzy-hackerone_test_gcp_uscentral1_1
      SNOWFLAKE_USER: H1_BB_RCTY_20260725_S283_OIDC_FORK_CONTROL
      SNOWFLAKE_ROLE: PUBLIC
    steps:
      - name: Checkout exact PR head SHA from default base repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false

      - name: Install Snowflake CLI and mint OIDC token
        uses: snowflakedb/snowflake-actions@2e71eae6178b79a47e63fdad96427c8335846e49
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Record allowlisted OIDC claims and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SNOWFLAKE_TOKEN:-}"
          echo "::add-mask::${SNOWFLAKE_TOKEN}"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os

          token = os.environ["SNOWFLAKE_TOKEN"]

          def decode(segment):
              segment += "=" * (-len(segment) % 4)
              return json.loads(base64.urlsafe_b64decode(segment))

          protected, payload, _ = token.split(".", 2)
          header = decode(protected)
          claims = decode(payload)
          header_allowlist = ("alg", "kid", "typ")
          claim_allowlist = (
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "repository_visibility",
              "event_name",
              "ref",
              "ref_type",
              "sha",
              "head_ref",
              "base_ref",
              "actor",
              "actor_id",
              "workflow",
              "workflow_ref",
              "workflow_sha",
              "environment",
              "runner_environment",
              "iat",
              "nbf",
              "exp",
              "jti",
          )
          print(
              json.dumps(
                  {
                      "token_sha256": hashlib.sha256(token.encode()).hexdigest(),
                      "header": {
                          key: header[key]
                          for key in header_allowlist
                          if key in header
                      },
                      "claims": {
                          key: claims[key]
                          for key in claim_allowlist
                          if key in claims
                      },
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Execute fork-controlled Snowflake identity probe
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.actual-sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          python3 fork_probe.py
